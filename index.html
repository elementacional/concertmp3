<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concert Audio Studio - Compact HD</title>
  
  <!-- Biblioteca LAME para codificação MP3 de alta fidelidade -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Impede a barra de rolagem principal da página */
      background: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .player-card {
      background: #1e1e1e;
      padding: 96px 20px; /* Aumentado 80px no topo e na base (de 16px para 96px) */
      border-radius: 12px;
      width: 100%;
      max-width: 620px;
      max-height: calc(100vh - 20px); /* Trava o painel verticalmente na tela */
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      overflow-y: auto; /* Garante rolagem interna mantendo o painel travado */
    }

    h2 { 
      margin: 0 0 10px 0; 
      color: #1db954; 
      text-align: center; 
      font-size: 1.25rem; 
      letter-spacing: 0.5px; 
    }
    
    .control-group {
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .file-input-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .file-count-badge {
      font-size: 0.8rem;
      color: #1db954;
      font-weight: 600;
      white-space: nowrap;
    }

    .crossfade-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .crossfade-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      color: #1db954;
      cursor: pointer;
    }

    .crossfade-toggle input {
      cursor: pointer;
      accent-color: #1db954;
    }

    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .playlist-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    label { font-size: 0.8rem; color: #b3b3b3; }

    input[type="file"] {
      background: #282828;
      padding: 6px;
      border-radius: 6px;
      color: transparent;
      border: 1px solid #333;
      font-size: 0.8rem;
      width: 150px;
      cursor: pointer;
    }

    input[type="file"]::-webkit-file-upload-button,
    input[type="file"]::file-selector-button {
      color: #fff;
      background: #333;
      border: 1px solid #444;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Equalizador Global */
    .eq-container {
      background: #242424;
      border: 1px solid #333;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .eq-title {
      font-size: 0.75rem;
      color: #1db954;
      font-weight: bold;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .eq-sliders {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .eq-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .eq-control span {
      font-size: 0.7rem;
      color: #aaa;
    }

    .eq-control input[type="range"], .control-group input[type="range"] {
      width: 100%;
      accent-color: #1db954;
    }

    /* Waveform & Barra Segmentada de Faixas */
    .timeline-container {
      position: relative;
      width: 100%;
      height: 70px;
      background-color: #0d0d0d;
      border-radius: 8px 8px 0 0;
      overflow: hidden;
      margin-top: 4px;
      border: 1px solid #333;
      border-bottom: none;
      cursor: pointer;
    }

    canvas#waveformCanvas {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      display: block;
    }

    .track-segment-bar {
      position: relative;
      width: 100%;
      height: 10px;
      background: #222222;
      border-radius: 0 0 8px 8px;
      overflow: hidden;
      border: 1px solid #333;
      border-top: none;
      display: flex;
      cursor: pointer;
      margin-bottom: 2px;
    }

    .segment-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: rgba(29, 185, 84, 0.45);
      pointer-events: none;
      transition: width 0.1s linear;
    }

    .segment-item {
      height: 100%;
      border-right: 2px solid #ff4444;
      box-sizing: border-box;
      position: relative;
      background: #2a2a2a;
    }

    .segment-item:last-child {
      border-right: none;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #888;
      margin-bottom: 2px;
      font-family: monospace;
    }

    /* Controles de Reprodução Compactos */
    .playback-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: #b3b3b3;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .btn-icon:hover:not(:disabled) { color: #fff; background: #282828; }

    .btn-main {
      background: #1db954;
      color: #000;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, background 0.2s;
    }

    .btn-main:hover:not(:disabled) { background: #1ed760; transform: scale(1.05); }
    .btn-main:disabled, .btn-icon:disabled { opacity: 0.4; cursor: not-allowed; }

    .status-panel {
      background: #282828;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      border-left: 3px solid #1db954;
      margin-bottom: 6px;
    }

    ul#playlist {
      list-style: none;
      padding: 0;
      margin: 4px 0 0 0;
      max-height: 120px;
      overflow-y: auto;
      flex-shrink: 1;
    }

    li.track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      background: #242424;
      margin-bottom: 3px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: grab;
      user-select: none;
      border: 1px solid transparent;
      transition: background 0.2s;
    }

    li.track-item:active { cursor: grabbing; }
    li.track-item.dragging { opacity: 0.4; border-color: #1db954; }
    li.track-item.active { background: #2e3b32; color: #1db954; font-weight: bold; }

    .track-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 8px;
      flex: 1;
    }

    .track-duration {
      font-size: 0.72rem;
      color: #777;
      margin-right: 6px;
      font-family: monospace;
    }

    .btn-remove {
      background: transparent;
      border: none;
      color: #888;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .btn-remove:hover { color: #ff5555; background: #333; }

    .btn-text-export, .btn-clear-playlist {
      background: transparent;
      border: 1px solid #444;
      color: #b3b3b3;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-text-export:hover:not(:disabled) {
      color: #1db954;
      border-color: #1db954;
      background: #242424;
    }

    .btn-clear-playlist:hover:not(:disabled) {
      color: #ff5555;
      border-color: #ff5555;
      background: #242424;
    }

    .btn-text-export:disabled, .btn-clear-playlist:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-download {
      width: 100%;
      background: #1db954;
      color: #000;
      font-weight: bold;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .btn-download:hover:not(:disabled) { background: #1ed760; }
    .btn-download:disabled { background: #333; color: #666; cursor: not-allowed; }

    .btn-download.cancel-mode {
      background: rgba(255, 68, 68, 0.25);
      color: #ff5555;
      border: 1px solid #ff5555;
      backdrop-filter: blur(4px);
    }

    .btn-download.cancel-mode:hover {
      background: rgba(255, 68, 68, 0.4);
      color: #ffffff;
    }

    .export-progress-panel {
      margin-top: 8px;
      background: #181818;
      border: 1px solid #333;
      padding: 8px;
      border-radius: 6px;
      display: none;
    }

    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background: #282828;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #1db954;
      transition: width 0.2s;
    }

    .progress-info {
      font-size: 0.7rem;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="player-card">
  <h2>Concert Audio v2.0 - Studio Stereo HD</h2>

  <div class="control-group">
    <label for="audioFiles">Adicionar arquivos de áudio (Stereo Preservado):</label>
    <div class="file-input-wrapper">
      <input type="file" id="audioFiles" accept="audio/*" multiple>
      <span id="fileCount" class="file-count-badge">0 faixas</span>
    </div>
  </div>

  <div class="control-group">
    <div class="crossfade-header">
      <label for="fadeTime">Tempo de Crossfade: <span id="fadeVal">5</span>s</label>
      <label class="crossfade-toggle">
        <input type="checkbox" id="chkEnableFade" checked>
        <span>Ativar Crossfade</span>
      </label>
    </div>
    <input type="range" id="fadeTime" min="1" max="15" value="5">
  </div>

  <!-- Equalizador Global -->
  <div class="eq-container">
    <div class="eq-title">Equalizador Global (Tempo Real)</div>
    <div class="eq-sliders">
      <div class="eq-control">
        <span>Graves (250Hz)</span>
        <input type="range" id="eqLow" min="-12" max="12" value="0" step="0.5">
        <span id="eqLowVal">0 dB</span>
      </div>
      <div class="eq-control">
        <span>Médios (1.5kHz)</span>
        <input type="range" id="eqMid" min="-12" max="12" value="0" step="0.5">
        <span id="eqMidVal">0 dB</span>
      </div>
      <div class="eq-control">
        <span>Agudos (4kHz)</span>
        <input type="range" id="eqHigh" min="-12" max="12" value="0" step="0.5">
        <span id="eqHighVal">0 dB</span>
      </div>
    </div>
  </div>

  <!-- Onda Sonora Espelhada com Traço Fino -->
  <div class="timeline-container" id="timelineContainer">
    <canvas id="waveformCanvas"></canvas>
  </div>

  <!-- Barra de Marcadores Vermelhos por Faixa -->
  <div class="track-segment-bar" id="trackSegmentBar">
    <div class="segment-fill" id="segmentFill"></div>
  </div>

  <div class="time-display">
    <span id="currentTimeDisplay">00:00:00</span>
    <span id="totalTimeDisplay">00:00:00</span>
  </div>

  <div class="playback-controls">
    <button id="btnPrev" class="btn-icon" disabled title="Anterior / Início">&lt;</button>
    <button id="btnPlayPause" class="btn-main" disabled title="Play/Pause">&#9654;</button>
    <button id="btnNext" class="btn-icon" disabled title="Próxima">&gt;</button>
  </div>

  <div class="status-panel">
    <div><strong>Tocando:</strong> <span id="currentTrack">-</span></div>
    <div><strong>Status:</strong> <span id="statusText">Aguardando arquivos de áudio...</span></div>
  </div>

  <div class="control-group">
    <div class="playlist-header">
      <label>Fila de Reprodução / Edição:</label>
      <div class="playlist-actions">
        <button id="btnClearPlaylist" class="btn-clear-playlist" title="Limpar playlist toda" disabled>
          (X) Limpar
        </button>
        <button id="btnCopyTxt" class="btn-text-export" title="Exportar relação das músicas em .txt" disabled>
          &#128196; Baixar .txt
        </button>
      </div>
    </div>
    <ul id="playlist"></ul>
  </div>

  <button id="btnExport" class="btn-download" disabled>
    <span>&#128190;</span> Baixar Master Unificada (MP3 320 kbps Stereo)
  </button>

  <div id="exportPanel" class="export-progress-panel">
    <div id="exportStatusText" style="font-size: 0.75rem; color: #fff;">Iniciando renderização de alta qualidade...</div>
    <div class="progress-bar-bg">
      <div id="exportProgressFill" class="progress-bar-fill"></div>
    </div>
    <div class="progress-info">
      <span id="exportTrackCurrent">Processando canais L/R...</span>
      <span id="exportPercent">0%</span>
    </div>
  </div>
</div>

<script>
  let audioCtx;
  let playlist = [];
  let currentIndex = 0;
  let currentSource = null;
  let currentGain = null;
  let isPlaying = false;
  let isPaused = false;
  
  let startTime = 0;
  let pauseOffset = 0;
  let animationFrameId = null;

  // Equalizador Biquad
  let eqLowNode = null;
  let eqMidNode = null;
  let eqHighNode = null;

  // Renderização e Exportação
  let isExporting = false;
  let activeWorker = null;
  let isExportCancelled = false;

  const fileInput = document.getElementById('audioFiles');
  const fileCountDisplay = document.getElementById('fileCount');
  const fadeSlider = document.getElementById('fadeTime');
  const fadeValDisplay = document.getElementById('fadeVal');
  const chkEnableFade = document.getElementById('chkEnableFade');
  const btnPlayPause = document.getElementById('btnPlayPause');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const statusText = document.getElementById('statusText');
  const currentTrackDisplay = document.getElementById('currentTrack');
  const playlistUI = document.getElementById('playlist');
  const btnCopyTxt = document.getElementById('btnCopyTxt');
  const btnClearPlaylist = document.getElementById('btnClearPlaylist');
  
  const timelineContainer = document.getElementById('timelineContainer');
  const trackSegmentBar = document.getElementById('trackSegmentBar');
  const segmentFill = document.getElementById('segmentFill');
  const canvas = document.getElementById('waveformCanvas');
  const canvasCtx = canvas.getContext('2d');
  const currentTimeDisplay = document.getElementById('currentTimeDisplay');
  const totalTimeDisplay = document.getElementById('totalTimeDisplay');

  const eqLowInput = document.getElementById('eqLow');
  const eqMidInput = document.getElementById('eqMid');
  const eqHighInput = document.getElementById('eqHigh');
  const eqLowVal = document.getElementById('eqLowVal');
  const eqMidVal = document.getElementById('eqMidVal');
  const eqHighVal = document.getElementById('eqHighVal');

  const btnExport = document.getElementById('btnExport');
  const exportPanel = document.getElementById('exportPanel');
  const exportStatusText = document.getElementById('exportStatusText');
  const exportProgressFill = document.getElementById('exportProgressFill');
  const exportTrackCurrent = document.getElementById('exportTrackCurrent');
  const exportPercent = document.getElementById('exportPercent');

  chkEnableFade.addEventListener('change', () => {
    fadeSlider.disabled = !chkEnableFade.checked;
    refreshWaveformView();
  });

  fadeSlider.addEventListener('input', () => {
    fadeValDisplay.textContent = fadeSlider.value;
    refreshWaveformView();
  });

  function getEffectiveFadeTime() {
    return chkEnableFade.checked ? parseFloat(fadeSlider.value) : 0;
  }

  function updateEqAndWaveform() {
    const lowDb = parseFloat(eqLowInput.value);
    const midDb = parseFloat(eqMidInput.value);
    const highDb = parseFloat(eqHighInput.value);

    eqLowVal.textContent = `${lowDb > 0 ? '+' : ''}${lowDb} dB`;
    eqMidVal.textContent = `${midDb > 0 ? '+' : ''}${midDb} dB`;
    eqHighVal.textContent = `${highDb > 0 ? '+' : ''}${highDb} dB`;

    if (eqLowNode) eqLowNode.gain.value = lowDb;
    if (eqMidNode) eqMidNode.gain.value = midDb;
    if (eqHighNode) eqHighNode.gain.value = highDb;

    refreshWaveformView();
  }

  function refreshWaveformView() {
    const elapsed = isPlaying ? (audioCtx ? audioCtx.currentTime - startTime : 0) : pauseOffset;
    drawGlobalTimeline(elapsed);
    renderTrackSegments(elapsed);
  }

  eqLowInput.addEventListener('input', updateEqAndWaveform);
  eqMidInput.addEventListener('input', updateEqAndWaveform);
  eqHighInput.addEventListener('input', updateEqAndWaveform);

  function initAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.destination.channelCount = 2;
      audioCtx.destination.channelCountMode = 'explicit';

      eqLowNode = audioCtx.createBiquadFilter();
      eqLowNode.type = 'lowshelf';
      eqLowNode.frequency.value = 250;
      eqLowNode.gain.value = parseFloat(eqLowInput.value);

      eqMidNode = audioCtx.createBiquadFilter();
      eqMidNode.type = 'peaking';
      eqMidNode.frequency.value = 1500;
      eqMidNode.Q.value = 1.0;
      eqMidNode.gain.value = parseFloat(eqMidInput.value);

      eqHighNode = audioCtx.createBiquadFilter();
      eqHighNode.type = 'highshelf';
      eqHighNode.frequency.value = 4000;
      eqHighNode.gain.value = parseFloat(eqHighInput.value);

      eqLowNode.connect(eqMidNode);
      eqMidNode.connect(eqHighNode);
      eqHighNode.connect(audioCtx.destination);
    }
  }

  function extractPeaks(buffer, numBars = 800) {
    const chanL = buffer.getChannelData(0);
    const chanR = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : chanL;
    const step = Math.floor(buffer.length / numBars);
    const peaks = [];

    for (let i = 0; i < numBars; i++) {
      const start = i * step;
      let max = 0;
      for (let j = 0; j < step; j++) {
        const absL = Math.abs(chanL[start + j] || 0);
        const absR = Math.abs(chanR[start + j] || 0);
        const maxSample = Math.max(absL, absR);
        if (maxSample > max) max = maxSample;
      }
      peaks.push(max);
    }
    return peaks;
  }

  fileInput.addEventListener('change', async (e) => {
    initAudioContext();
    
    const files = Array.from(e.target.files);
    statusText.textContent = "Carregando e analisando áudios...";

    for (const file of files) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        const buffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
        const peaks = extractPeaks(buffer, 800);

        playlist.push({
          file: file,
          buffer: buffer,
          duration: buffer.duration,
          peaks: peaks
        });
      } catch (err) {
        console.error("Erro ao decodificar áudio:", file.name);
      }
    }

    renderPlaylist();
    refreshWaveformView();

    if (playlist.length > 0 && !isPlaying && !isPaused) {
      btnPlayPause.disabled = false;
      statusText.textContent = `${playlist.length} faixas prontas.`;
    }
  });

  function handleTimelineClick(e, container) {
    if (playlist.length === 0) return;

    const rect = container.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, clickX / rect.width));

    const totalDuration = getTotalPlaylistDuration();
    const targetGlobalTime = ratio * totalDuration;

    seekToGlobalTime(targetGlobalTime);
  }

  timelineContainer.addEventListener('click', (e) => handleTimelineClick(e, timelineContainer));
  trackSegmentBar.addEventListener('click', (e) => handleTimelineClick(e, trackSegmentBar));

  function seekToGlobalTime(targetGlobalTime) {
    const fadeTime = getEffectiveFadeTime();
    let accumulatedTime = 0;
    let targetIndex = 0;
    let targetOffset = 0;

    for (let i = 0; i < playlist.length; i++) {
      const track = playlist[i];
      const effectiveDuration = (i === playlist.length - 1) ? track.duration : track.duration - fadeTime;

      if (targetGlobalTime <= accumulatedTime + effectiveDuration) {
        targetIndex = i;
        targetOffset = targetGlobalTime - accumulatedTime;
        break;
      }
      accumulatedTime += effectiveDuration;
    }

    if (currentSource) {
      try { currentSource.stop(); } catch(e){}
    }

    playTrack(targetIndex, 0, targetOffset);
  }

  function formatTimeHHMMSS(seconds) {
    if (isNaN(seconds) || seconds <= 0) return "00:00:00";
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);
    
    return [hrs, mins, secs]
      .map(v => v.toString().padStart(2, '0'))
      .join(':');
  }

  function getTotalPlaylistDuration() {
    if (playlist.length === 0) return 0;
    const fadeTime = getEffectiveFadeTime();
    const rawTotal = playlist.reduce((acc, track) => acc + track.duration, 0);
    const overlaps = (playlist.length - 1) * fadeTime;
    return Math.max(0, rawTotal - overlaps);
  }

  function getAccumulatedTimeBeforeCurrent() {
    const fadeTime = getEffectiveFadeTime();
    let acc = 0;
    for (let i = 0; i < currentIndex; i++) {
      acc += (playlist[i].duration - fadeTime);
    }
    return Math.max(0, acc);
  }

  function renderTrackSegments(currentElapsedInTrack = 0) {
    const totalDuration = getTotalPlaylistDuration();

    const oldItems = trackSegmentBar.querySelectorAll('.segment-item');
    oldItems.forEach(el => el.remove());

    if (playlist.length === 0 || totalDuration <= 0) {
      segmentFill.style.width = '0%';
      return;
    }

    const fadeTime = getEffectiveFadeTime();

    playlist.forEach((track, idx) => {
      const seg = document.createElement('div');
      seg.className = 'segment-item';
      
      const effectiveDuration = (idx === playlist.length - 1) ? track.duration : track.duration - fadeTime;
      const pct = (effectiveDuration / totalDuration) * 100;
      seg.style.width = `${pct}%`;

      trackSegmentBar.appendChild(seg);
    });

    const globalElapsed = (isPlaying || isPaused) ? getAccumulatedTimeBeforeCurrent() + currentElapsedInTrack : 0;
    const globalPct = Math.min(100, Math.max(0, (globalElapsed / totalDuration) * 100));
    segmentFill.style.width = `${globalPct}%`;
  }

  function drawGlobalTimeline(currentElapsedInTrack = 0) {
    const dpr = window.devicePixelRatio || 1;
    const displayWidth = timelineContainer.clientWidth;
    const displayHeight = timelineContainer.clientHeight;

    canvas.width = displayWidth * dpr;
    canvas.height = displayHeight * dpr;

    canvasCtx.save();
    canvasCtx.scale(dpr, dpr);
    canvasCtx.clearRect(0, 0, displayWidth, displayHeight);

    if (playlist.length === 0) {
      canvasCtx.restore();
      return;
    }

    const totalDuration = getTotalPlaylistDuration();
    if (totalDuration <= 0) {
      canvasCtx.restore();
      return;
    }

    const globalElapsed = (isPlaying || isPaused) ? getAccumulatedTimeBeforeCurrent() + currentElapsedInTrack : 0;
    const progressRatio = Math.min(1, globalElapsed / totalDuration);
    const currentProgressX = progressRatio * displayWidth;

    let combinedPeaks = [];
    playlist.forEach((track) => {
      if (track.peaks) {
        combinedPeaks = combinedPeaks.concat(track.peaks);
      }
    });

    if (combinedPeaks.length === 0) {
      canvasCtx.restore();
      return;
    }

    const lowDb = parseFloat(eqLowInput.value);
    const midDb = parseFloat(eqMidInput.value);
    const highDb = parseFloat(eqHighInput.value);
    
    const avgDb = (lowDb * 0.45) + (midDb * 0.35) + (highDb * 0.20);
    const eqScaleFactor = Math.pow(10, avgDb / 20);

    const centerY = displayHeight / 2;
    const totalBars = Math.floor(displayWidth / 1.5);

    for (let i = 0; i < totalBars; i++) {
      const peakIdx = Math.floor((i / totalBars) * combinedPeaks.length);
      const rawVal = combinedPeaks[peakIdx] || 0.05;
      
      const val = Math.min(1.0, rawVal * eqScaleFactor);

      const barHeight = Math.max(2, val * (displayHeight * 0.95));
      const x = i * 1.5;

      if (x <= currentProgressX) {
        canvasCtx.strokeStyle = '#1db954';
      } else {
        canvasCtx.strokeStyle = '#00aaff';
      }

      canvasCtx.lineWidth = 0.8;
      canvasCtx.beginPath();
      canvasCtx.moveTo(x, centerY - barHeight / 2);
      canvasCtx.lineTo(x, centerY + barHeight / 2);
      canvasCtx.stroke();
    }

    if (isPlaying || isPaused) {
      canvasCtx.fillStyle = '#ffffff';
      canvasCtx.fillRect(currentProgressX, 0, 1.5, displayHeight);
      currentTimeDisplay.textContent = formatTimeHHMMSS(globalElapsed);
    } else {
      currentTimeDisplay.textContent = "00:00:00";
    }

    totalTimeDisplay.textContent = formatTimeHHMMSS(totalDuration);
    canvasCtx.restore();
  }

  async function playTrack(index, fadeDuration = 0, offset = 0) {
    if (index < 0 || index >= playlist.length) return;

    initAudioContext();
    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }

    const track = playlist[index];
    
    try {
      const newSource = audioCtx.createBufferSource();
      const newGain = audioCtx.createGain();
      newSource.buffer = track.buffer;

      newSource.connect(newGain);
      newGain.connect(eqLowNode);

      const now = audioCtx.currentTime;

      if (fadeDuration > 0 && currentGain) {
        currentGain.gain.setValueAtTime(currentGain.gain.value, now);
        currentGain.gain.linearRampToValueAtTime(0.001, now + fadeDuration);
        
        const oldSource = currentSource;
        setTimeout(() => {
          try { oldSource.stop(); } catch(e){}
        }, fadeDuration * 1000);

        newGain.gain.setValueAtTime(0.001, now);
        newGain.gain.linearRampToValueAtTime(1, now + fadeDuration);
      } else {
        newGain.gain.setValueAtTime(1, now);
      }

      newSource.start(now, offset);

      currentSource = newSource;
      currentGain = newGain;
      currentIndex = index;
      isPlaying = true;
      isPaused = false;
      
      startTime = now - offset;
      pauseOffset = 0;

      btnPlayPause.innerHTML = '&#10074;&#10074;';
      btnPlayPause.disabled = false;
      btnPrev.disabled = false;
      btnNext.disabled = false;

      currentTrackDisplay.textContent = track.file.name;
      statusText.textContent = "Reproduzindo (Stereo High-Quality)";

      renderPlaylist();
      trackProgress();

    } catch (err) {
      statusText.textContent = "Erro na execução do áudio.";
    }
  }

  function trackProgress() {
    if (!isPlaying || isPaused) return;

    const elapsed = audioCtx.currentTime - startTime;
    const duration = playlist[currentIndex].duration;
    const fadeTime = getEffectiveFadeTime();

    drawGlobalTimeline(elapsed);
    renderTrackSegments(elapsed);

    if (duration > fadeTime && (duration - elapsed) <= fadeTime && currentIndex + 1 < playlist.length) {
      const nextIdx = currentIndex + 1;
      playTrack(nextIdx, fadeTime, 0);
      return;
    }

    animationFrameId = requestAnimationFrame(trackProgress);
  }

  function pauseAudio() {
    if (!isPlaying || isPaused) return;
    
    pauseOffset = audioCtx.currentTime - startTime;
    if (currentSource) {
      try { currentSource.stop(); } catch(e){}
    }
    
    isPaused = true;
    isPlaying = false;
    btnPlayPause.innerHTML = '&#9654;';
    statusText.textContent = "Pausado";
    cancelAnimationFrame(animationFrameId);
  }

  btnPlayPause.addEventListener('click', () => {
    if (isPlaying) {
      pauseAudio();
    } else if (isPaused) {
      playTrack(currentIndex, 0, pauseOffset);
    } else if (playlist.length > 0) {
      playTrack(currentIndex, 0, 0);
    }
  });

  btnNext.addEventListener('click', () => {
    if (playlist.length === 0) return;
    
    let nextIdx = currentIndex + 1;
    if (nextIdx >= playlist.length) nextIdx = 0;

    if (isPlaying) {
      const fadeTime = getEffectiveFadeTime();
      playTrack(nextIdx, fadeTime, 0);
    } else {
      currentIndex = nextIdx;
      pauseOffset = 0;
      currentTrackDisplay.textContent = playlist[currentIndex].file.name;
      statusText.textContent = `Selecionada: Faixa ${currentIndex + 1}`;
      renderPlaylist();
      refreshWaveformView();
    }
  });

  btnPrev.addEventListener('click', () => {
    if (playlist.length === 0) return;

    let currentElapsed = isPlaying ? (audioCtx.currentTime - startTime) : pauseOffset;

    if (currentElapsed > 2) {
      if (isPlaying) {
        playTrack(currentIndex, 0, 0);
      } else {
        pauseOffset = 0;
        refreshWaveformView();
        statusText.textContent = "Reiniciado no início da faixa.";
      }
    } else {
      let prevIdx = currentIndex > 0 ? currentIndex - 1 : 0;
      if (isPlaying) {
        playTrack(prevIdx, 0, 0);
      } else {
        currentIndex = prevIdx;
        pauseOffset = 0;
        currentTrackDisplay.textContent = playlist[currentIndex].file.name;
        statusText.textContent = `Selecionada: Faixa ${currentIndex + 1}`;
        renderPlaylist();
        refreshWaveformView();
      }
    }
  });

  btnClearPlaylist.addEventListener('click', () => {
    if (playlist.length === 0) return;

    if (currentSource) try { currentSource.stop(); } catch(e){}
    isPlaying = false;
    isPaused = false;
    playlist = [];
    currentIndex = 0;
    pauseOffset = 0;
    
    btnPlayPause.innerHTML = '&#9654;';
    fileInput.value = '';
    
    renderPlaylist();
    refreshWaveformView();
  });

  function renderPlaylist() {
    playlistUI.innerHTML = '';

    const total = playlist.length;
    fileCountDisplay.textContent = `${total} ${total === 1 ? 'faixa' : 'faixas'}`;
    if (!isExporting) btnExport.disabled = total === 0;
    btnCopyTxt.disabled = total === 0;
    btnClearPlaylist.disabled = total === 0;

    if (total === 0) {
      statusText.textContent = "Nenhum arquivo na fila.";
      currentTrackDisplay.textContent = "-";
      btnPlayPause.disabled = true;
      btnPrev.disabled = true;
      btnNext.disabled = true;
      refreshWaveformView();
      return;
    }

    btnPlayPause.disabled = false;
    btnPrev.disabled = false;
    btnNext.disabled = false;

    playlist.forEach((track, idx) => {
      const li = document.createElement('li');
      li.className = 'track-item';
      if (idx === currentIndex && (isPlaying || isPaused)) {
        li.classList.add('active');
      }
      li.draggable = true;
      li.dataset.index = idx;

      li.innerHTML = `
        <span class="track-name">${idx + 1}. ${track.file.name}</span>
        <span class="track-duration">${formatTimeHHMMSS(track.duration)}</span>
        <button class="btn-remove" title="Remover faixa">&times;</button>
      `;

      li.querySelector('.btn-remove').addEventListener('click', (e) => {
        e.stopPropagation();
        removeTrack(idx);
      });

      li.addEventListener('dragstart', handleDragStart);
      li.addEventListener('dragover', handleDragOver);
      li.addEventListener('drop', handleDrop);
      li.addEventListener('dragend', handleDragEnd);

      playlistUI.appendChild(li);
    });

    if (!isPlaying && !isPaused) {
      statusText.textContent = `${playlist.length} faixa(s) carregada(s).`;
      if (playlist[currentIndex]) {
        currentTrackDisplay.textContent = playlist[currentIndex].file.name;
      }
    }
  }

  function removeTrack(idx) {
    playlist.splice(idx, 1);

    if (playlist.length === 0) {
      if (currentSource) try { currentSource.stop(); } catch(e){}
      isPlaying = false;
      isPaused = false;
      btnPlayPause.innerHTML = '&#9654;';
      renderPlaylist();
      refreshWaveformView();
      return;
    }

    if (idx === currentIndex) {
      if (currentSource) try { currentSource.stop(); } catch(e){}
      isPlaying = false;
      isPaused = false;
      btnPlayPause.innerHTML = '&#9654;';
      
      if (currentIndex >= playlist.length) {
        currentIndex = playlist.length - 1;
      }
      statusText.textContent = "Faixa removida.";
    } else if (idx < currentIndex) {
      currentIndex--;
    }

    renderPlaylist();
    refreshWaveformView();
  }

  let dragSrcIndex = null;

  function handleDragStart(e) {
    dragSrcIndex = Number(this.dataset.index);
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }

  function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  }

  function handleDrop(e) {
    e.preventDefault();
    const targetIndex = Number(this.dataset.index);

    if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
      const movedItem = playlist.splice(dragSrcIndex, 1)[0];
      playlist.splice(targetIndex, 0, movedItem);

      if (currentIndex === dragSrcIndex) {
        currentIndex = targetIndex;
      } else if (dragSrcIndex < currentIndex && targetIndex >= currentIndex) {
        currentIndex--;
      } else if (dragSrcIndex > currentIndex && targetIndex <= currentIndex) {
        currentIndex++;
      }

      renderPlaylist();
      refreshWaveformView();
    }
  }

  function handleDragEnd() {
    this.classList.remove('dragging');
  }

  btnCopyTxt.addEventListener('click', () => {
    if (playlist.length === 0) return;

    let txtContent = "RELAÇÃO DA PLAYLIST - CONCERT AUDIO\n\n";
    playlist.forEach((track, idx) => {
      txtContent += `${idx + 1}. ${track.file.name} (${formatTimeHHMMSS(track.duration)})\n`;
    });

    const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'relacao_playlist.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // Exportação MP3
  function encodeMp3Async(audioBuffer, bitrate, onProgress) {
    return new Promise((resolve, reject) => {
      const workerCode = `
        importScripts('https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js');

        self.onmessage = function(e) {
          const { left, right, sampleRate, bitrate } = e.data;
          
          const mp3encoder = new lamejs.Mp3Encoder(2, sampleRate, bitrate);
          const mp3Data = [];
          const sampleBlockSize = 1152;
          const totalSamples = left.length;

          for (let i = 0; i < totalSamples; i += sampleBlockSize) {
            const leftChunk = left.subarray(i, i + sampleBlockSize);
            const rightChunk = right.subarray(i, i + sampleBlockSize);
            
            const mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
            if (mp3buf.length > 0) {
              mp3Data.push(mp3buf);
            }

            if (i % (sampleBlockSize * 40) === 0) {
              self.postMessage({ type: 'progress', progress: i / totalSamples });
            }
          }

          const endBuf = mp3encoder.flush();
          if (endBuf.length > 0) {
            mp3Data.push(endBuf);
          }

          self.postMessage({ type: 'complete', data: mp3Data });
        };
      `;

      const blob = new Blob([workerCode], { type: 'application/javascript' });
      activeWorker = new Worker(URL.createObjectURL(blob));

      const leftFloat = audioBuffer.getChannelData(0);
      const rightFloat = audioBuffer.numberOfChannels > 1 ? audioBuffer.getChannelData(1) : leftFloat;

      let maxPeakL = 0;
      let maxPeakR = 0;

      for (let i = 0; i < leftFloat.length; i++) {
        const absL = Math.abs(leftFloat[i]);
        const absR = Math.abs(rightFloat[i]);
        if (absL > maxPeakL) maxPeakL = absL;
        if (absR > maxPeakR) maxPeakR = absR;
      }

      const targetPeak = 0.98;
      const globalMax = Math.max(maxPeakL, maxPeakR);
      const scale = globalMax > 0 ? targetPeak / globalMax : 1;

      const leftInt16 = new Int16Array(leftFloat.length);
      const rightInt16 = new Int16Array(rightFloat.length);

      for (let i = 0; i < leftFloat.length; i++) {
        let sL = Math.max(-1, Math.min(1, leftFloat[i] * scale));
        leftInt16[i] = sL < 0 ? sL * 32768 : sL * 32767;

        let sR = Math.max(-1, Math.min(1, rightFloat[i] * scale));
        rightInt16[i] = sR < 0 ? sR * 32768 : sR * 32767;
      }

      activeWorker.onmessage = (e) => {
        if (isExportCancelled) {
          activeWorker.terminate();
          activeWorker = null;
          reject(new Error("CANCELLED"));
          return;
        }

        if (e.data.type === 'progress') {
          onProgress(e.data.progress);
        } else if (e.data.type === 'complete') {
          const blob = new Blob(e.data.data, { type: 'audio/mp3' });
          activeWorker.terminate();
          activeWorker = null;
          resolve(blob);
        }
      };

      activeWorker.onerror = (err) => {
        if (activeWorker) activeWorker.terminate();
        activeWorker = null;
        reject(err);
      };

      activeWorker.postMessage({
        left: leftInt16,
        right: rightInt16,
        sampleRate: audioBuffer.sampleRate,
        bitrate: bitrate
      }, [leftInt16.buffer, rightInt16.buffer]);
    });
  }

  function resetExportButtonState() {
    isExporting = false;
    btnExport.classList.remove('cancel-mode');
    btnExport.innerHTML = `<span>&#128190;</span> Baixar Master Unificada (MP3 320 kbps Stereo)`;
    btnExport.disabled = playlist.length === 0;
  }

  function setCancelButtonState() {
    isExporting = true;
    btnExport.classList.add('cancel-mode');
    btnExport.innerHTML = `<span>&#10060;</span> Cancelar Operação`;
    btnExport.disabled = false;
  }

  btnExport.addEventListener('click', async () => {
    if (isExporting) {
      isExportCancelled = true;
      if (activeWorker) {
        activeWorker.terminate();
        activeWorker = null;
      }
      exportStatusText.textContent = "Renderização cancelada.";
      exportProgressFill.style.width = '0%';
      exportPercent.textContent = '0%';
      
      setTimeout(() => {
        exportPanel.style.display = 'none';
        resetExportButtonState();
      }, 1000);
      return;
    }

    if (playlist.length === 0) return;

    isExportCancelled = false;
    setCancelButtonState();

    exportPanel.style.display = 'block';
    exportStatusText.textContent = "Iniciando renderização...";
    exportProgressFill.style.width = '5%';
    exportPercent.textContent = '5%';

    try {
      const sampleRate = playlist[0].buffer.sampleRate;
      const totalDuration = getTotalPlaylistDuration();
      const totalLength = Math.ceil(totalDuration * sampleRate);

      const offlineCtx = new OfflineAudioContext(2, totalLength, sampleRate);
      
      const offEqLow = offlineCtx.createBiquadFilter();
      offEqLow.type = 'lowshelf';
      offEqLow.frequency.value = 250;
      offEqLow.gain.value = parseFloat(eqLowInput.value);

      const offEqMid = offlineCtx.createBiquadFilter();
      offEqMid.type = 'peaking';
      offEqMid.frequency.value = 1500;
      offEqMid.Q.value = 1.0;
      offEqMid.gain.value = parseFloat(eqMidInput.value);

      const offEqHigh = offlineCtx.createBiquadFilter();
      offEqHigh.type = 'highshelf';
      offEqHigh.frequency.value = 4000;
      offEqHigh.gain.value = parseFloat(eqHighInput.value);

      offEqLow.connect(offEqMid);
      offEqMid.connect(offEqHigh);
      offEqHigh.connect(offlineCtx.destination);

      const fadeTime = getEffectiveFadeTime();
      let currentStartTime = 0;

      playlist.forEach((track, idx) => {
        const source = offlineCtx.createBufferSource();
        const gainNode = offlineCtx.createGain();
        source.buffer = track.buffer;

        source.connect(gainNode);
        gainNode.connect(offEqLow);

        source.start(currentStartTime);

        if (idx > 0 && fadeTime > 0) {
          gainNode.gain.setValueAtTime(0, currentStartTime);
          gainNode.gain.linearRampToValueAtTime(1, currentStartTime + fadeTime);
        }

        if (idx < playlist.length - 1 && fadeTime > 0) {
          const fadeOutStart = currentStartTime + track.duration - fadeTime;
          gainNode.gain.setValueAtTime(1, fadeOutStart);
          gainNode.gain.linearRampToValueAtTime(0, fadeOutStart + fadeTime);
        }

        currentStartTime += (track.duration - fadeTime);
      });

      if (isExportCancelled) throw new Error("CANCELLED");

      exportStatusText.textContent = "Mesclando canais Stereo L/R...";
      exportProgressFill.style.width = '20%';
      exportPercent.textContent = '20%';

      const renderedBuffer = await offlineCtx.startRendering();

      if (isExportCancelled) throw new Error("CANCELLED");

      exportStatusText.textContent = "Codificando MP3 320 kbps...";

      const mp3Blob = await encodeMp3Async(renderedBuffer, 320, (progress) => {
        if (isExportCancelled) return;
        const realPercent = Math.floor(20 + progress * 75);
        exportProgressFill.style.width = `${realPercent}%`;
        exportPercent.textContent = `${realPercent}%`;
      });

      if (isExportCancelled) throw new Error("CANCELLED");

      exportProgressFill.style.width = '100%';
      exportPercent.textContent = '100%';
      exportStatusText.textContent = "Concluído com sucesso!";

      const url = URL.createObjectURL(mp3Blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Concert_Audio_Master_Stereo_320kbps.mp3';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

    } catch (err) {
      if (err.message === "CANCELLED") {
        console.log("Cancelado.");
      } else {
        console.error("Erro na exportação:", err);
        exportStatusText.textContent = "Erro na geração do MP3.";
      }
    } finally {
      setTimeout(() => {
        exportPanel.style.display = 'none';
        resetExportButtonState();
      }, 2000);
    }
  });

  window.addEventListener('load', () => refreshWaveformView());
  window.addEventListener('resize', () => refreshWaveformView());
</script>
