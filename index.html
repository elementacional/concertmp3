<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concert MP3</title>
  
  <!-- FFmpeg WebAssembly - Versão Single-Thread (Compatível nativamente com GitHub Pages) -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.10.1/dist/ffmpeg.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .player-card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; color: #1db954; text-align: center; font-size: 1.4rem; }
    
    .control-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .file-input-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .file-count-badge {
      font-size: 0.85rem;
      color: #1db954;
      font-weight: 600;
      white-space: nowrap;
    }
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    label { font-size: 0.85rem; color: #b3b3b3; }

    input[type="file"] {
      background: #282828;
      padding: 8px;
      border-radius: 6px;
      color: transparent;
      border: 1px solid #333;
      font-size: 0.85rem;
      width: 150px;
      cursor: pointer;
    }

    input[type="file"]::-webkit-file-upload-button,
    input[type="file"]::file-selector-button {
      color: #fff;
      background: #333;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .timeline-container {
      position: relative;
      width: 100%;
      height: 12px;
      background-color: #282828;
      border-radius: 6px;
      overflow: hidden;
      margin: 15px 0 6px 0;
      border: 1px solid #333;
      cursor: pointer;
    }

    canvas#waveformCanvas {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 15px;
    }

    .playback-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: #b3b3b3;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .btn-icon:hover:not(:disabled) { color: #fff; background: #282828; }

    .btn-main {
      background: #1db954;
      color: #000;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, background 0.2s;
    }

    .btn-main:hover:not(:disabled) { background: #1ed760; transform: scale(1.05); }
    .btn-main:disabled, .btn-icon:disabled { opacity: 0.4; cursor: not-allowed; }

    .status-panel {
      background: #282828;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      border-left: 3px solid #1db954;
      margin-bottom: 15px;
    }

    ul#playlist {
      list-style: none;
      padding: 0;
      margin: 8px 0 0 0;
      max-height: 180px;
      overflow-y: auto;
    }

    li.track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #242424;
      margin-bottom: 4px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: grab;
      user-select: none;
      border: 1px solid transparent;
      transition: background 0.2s;
    }

    li.track-item:active { cursor: grabbing; }
    li.track-item.dragging { opacity: 0.4; border-color: #1db954; }
    li.track-item.active { background: #2e3b32; color: #1db954; font-weight: bold; }

    .track-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 10px;
      flex: 1;
    }

    .track-duration {
      font-size: 0.75rem;
      color: #777;
      margin-right: 8px;
      font-family: monospace;
    }

    .btn-remove {
      background: transparent;
      border: none;
      color: #888;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .btn-remove:hover { color: #ff5555; background: #333; }

    .btn-text-export {
      background: transparent;
      border: 1px solid #444;
      color: #b3b3b3;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-text-export:hover:not(:disabled) {
      color: #1db954;
      border-color: #1db954;
      background: #242424;
    }

    .btn-text-export:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-download {
      width: 100%;
      background: #1db954;
      color: #000;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-download:hover:not(:disabled) { background: #1ed760; }
    .btn-download:disabled { background: #333; color: #666; cursor: not-allowed; }

    .export-progress-panel {
      margin-top: 12px;
      background: #181818;
      border: 1px solid #333;
      padding: 12px;
      border-radius: 6px;
      display: none;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #282828;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #1db954;
      transition: width 0.2s;
    }

    .progress-info {
      font-size: 0.75rem;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="player-card">
  <h2>Concert MP3</h2>

  <div class="control-group">
    <label for="audioFiles">Adicionar arquivos MP3:</label>
    <div class="file-input-wrapper">
      <input type="file" id="audioFiles" accept="audio/mp3, audio/mpeg" multiple>
      <span id="fileCount" class="file-count-badge">0 faixas</span>
    </div>
  </div>

  <div class="control-group">
    <label for="fadeTime">Tempo de Crossfade: <span id="fadeVal">5</span>s</label>
    <input type="range" id="fadeTime" min="1" max="15" value="5">
  </div>

  <div class="timeline-container" id="timelineContainer">
    <canvas id="waveformCanvas"></canvas>
  </div>
  <div class="time-display">
    <span id="currentTimeDisplay">00:00:00</span>
    <span id="totalTimeDisplay">00:00:00</span>
  </div>

  <div class="playback-controls">
    <button id="btnPrev" class="btn-icon" disabled title="Anterior">&lt;</button>
    <button id="btnPlayPause" class="btn-main" disabled title="Play/Pause">&#9654;</button>
    <button id="btnNext" class="btn-icon" disabled title="Próxima">&gt;</button>
  </div>

  <div class="status-panel">
    <div><strong>Tocando:</strong> <span id="currentTrack">-</span></div>
    <div><strong>Status:</strong> <span id="statusText">Aguardando áudios...</span></div>
  </div>

  <div class="control-group">
    <div class="playlist-header">
      <label>Playlist (Arraste para reordenar):</label>
      <button id="btnCopyTxt" class="btn-text-export" title="Exportar relação em .txt" disabled>
        &#128196; Baixar .txt
      </button>
    </div>
    <ul id="playlist"></ul>
  </div>

  <button id="btnExport" class="btn-download" disabled>
    <span>&#128190;</span> Baixar Playlist Unificada (MP3)
  </button>

  <div id="exportPanel" class="export-progress-panel">
    <div id="exportStatusText" style="font-size: 0.8rem; color: #fff;">Iniciando motor FFmpeg...</div>
    <div class="progress-bar-bg">
      <div id="exportProgressFill" class="progress-bar-fill"></div>
    </div>
    <div class="progress-info">
      <span id="exportTrackCurrent">Processando...</span>
      <span id="exportPercent">0%</span>
    </div>
  </div>
</div>

<script>
  let audioCtx;
  let playlist = [];
  let currentIndex = 0;
  let currentSource = null;
  let currentGain = null;
  let isPlaying = false;
  let isPaused = false;
  
  let startTime = 0;
  let pauseOffset = 0;
  let animationFrameId = null;

  const { createFFmpeg, fetchFile } = FFmpeg;
  let ffmpeg = null;

  const fileInput = document.getElementById('audioFiles');
  const fileCountDisplay = document.getElementById('fileCount');
  const fadeSlider = document.getElementById('fadeTime');
  const fadeValDisplay = document.getElementById('fadeVal');
  const btnPlayPause = document.getElementById('btnPlayPause');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const statusText = document.getElementById('statusText');
  const currentTrackDisplay = document.getElementById('currentTrack');
  const playlistUI = document.getElementById('playlist');
  const btnCopyTxt = document.getElementById('btnCopyTxt');
  
  const timelineContainer = document.getElementById('timelineContainer');
  const canvas = document.getElementById('waveformCanvas');
  const canvasCtx = canvas.getContext('2d');
  const currentTimeDisplay = document.getElementById('currentTimeDisplay');
  const totalTimeDisplay = document.getElementById('totalTimeDisplay');

  const btnExport = document.getElementById('btnExport');
  const exportPanel = document.getElementById('exportPanel');
  const exportStatusText = document.getElementById('exportStatusText');
  const exportProgressFill = document.getElementById('exportProgressFill');
  const exportTrackCurrent = document.getElementById('exportTrackCurrent');
  const exportPercent = document.getElementById('exportPercent');

  fadeSlider.addEventListener('input', () => {
    fadeValDisplay.textContent = fadeSlider.value;
    drawGlobalTimeline();
  });

  fileInput.addEventListener('change', async (e) => {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    
    const files = Array.from(e.target.files);
    statusText.textContent = "Processando arquivos...";

    for (const file of files) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        const buffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
        playlist.push({
          file: file,
          buffer: buffer,
          duration: buffer.duration,
          rawBuffer: arrayBuffer
        });
      } catch (err) {
        console.error("Erro ao decodificar áudio:", file.name);
      }
    }

    renderPlaylist();
    drawGlobalTimeline();

    if (playlist.length > 0 && !isPlaying && !isPaused) {
      btnPlayPause.disabled = false;
      statusText.textContent = `${playlist.length} faixas na fila.`;
    }
  });

  timelineContainer.addEventListener('click', (e) => {
    if (playlist.length === 0) return;

    const rect = timelineContainer.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, clickX / rect.width));

    const totalDuration = getTotalPlaylistDuration();
    const targetGlobalTime = ratio * totalDuration;

    seekToGlobalTime(targetGlobalTime);
  });

  function seekToGlobalTime(targetGlobalTime) {
    const fadeTime = parseFloat(fadeSlider.value);
    let accumulatedTime = 0;
    let targetIndex = 0;
    let targetOffset = 0;

    for (let i = 0; i < playlist.length; i++) {
      const track = playlist[i];
      const effectiveDuration = (i === playlist.length - 1) ? track.duration : track.duration - fadeTime;

      if (targetGlobalTime <= accumulatedTime + effectiveDuration) {
        targetIndex = i;
        targetOffset = targetGlobalTime - accumulatedTime;
        break;
      }
      accumulatedTime += effectiveDuration;
    }

    if (currentSource) {
      try { currentSource.stop(); } catch(e){}
    }

    playTrack(targetIndex, 0, targetOffset);
  }

  function formatTimeHHMMSS(seconds) {
    if (isNaN(seconds) || seconds <= 0) return "00:00:00";
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);
    
    return [hrs, mins, secs]
      .map(v => v.toString().padStart(2, '0'))
      .join(':');
  }

  function getTotalPlaylistDuration() {
    if (playlist.length === 0) return 0;
    const fadeTime = parseFloat(fadeSlider.value);
    const rawTotal = playlist.reduce((acc, track) => acc + track.duration, 0);
    const overlaps = (playlist.length - 1) * fadeTime;
    return Math.max(0, rawTotal - overlaps);
  }

  function getAccumulatedTimeBeforeCurrent() {
    const fadeTime = parseFloat(fadeSlider.value);
    let acc = 0;
    for (let i = 0; i < currentIndex; i++) {
      acc += (playlist[i].duration - fadeTime);
    }
    return Math.max(0, acc);
  }

  function drawGlobalTimeline(currentElapsedInTrack = 0) {
    const w = canvas.width = canvas.clientWidth;
    const h = canvas.height = canvas.clientHeight;
    
    canvasCtx.clearRect(0, 0, w, h);

    if (playlist.length === 0) return;

    const totalDuration = getTotalPlaylistDuration();
    if (totalDuration <= 0) return;

    const fadeTime = parseFloat(fadeSlider.value);
    let currentX = 0;

    playlist.forEach((track, idx) => {
      const effectiveDuration = (idx === playlist.length - 1) ? track.duration : track.duration - fadeTime;
      const trackWidth = (effectiveDuration / totalDuration) * w;

      canvasCtx.fillStyle = (idx % 2 === 0) ? '#2a2a2a' : '#333333';
      canvasCtx.fillRect(currentX, 0, trackWidth, h);

      if (idx < playlist.length - 1) {
        canvasCtx.strokeStyle = 'rgba(255, 85, 85, 0.7)';
        canvasCtx.lineWidth = 1;
        canvasCtx.beginPath();
        canvasCtx.moveTo(currentX + trackWidth, 0);
        canvasCtx.lineTo(currentX + trackWidth, h);
        canvasCtx.stroke();
      }

      currentX += trackWidth;
    });

    if (isPlaying || isPaused) {
      const globalElapsed = getAccumulatedTimeBeforeCurrent() + currentElapsedInTrack;
      const progressWidth = Math.min(w, (globalElapsed / totalDuration) * w);

      canvasCtx.fillStyle = 'rgba(29, 185, 84, 0.5)';
      canvasCtx.fillRect(0, 0, progressWidth, h);

      canvasCtx.fillStyle = '#1db954';
      canvasCtx.fillRect(Math.max(0, progressWidth - 1), 0, 2, h);

      currentTimeDisplay.textContent = formatTimeHHMMSS(globalElapsed);
    } else {
      currentTimeDisplay.textContent = "00:00:00";
    }

    totalTimeDisplay.textContent = formatTimeHHMMSS(totalDuration);
  }

  async function playTrack(index, fadeDuration = 0, offset = 0) {
    if (index < 0 || index >= playlist.length) return;

    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }

    const track = playlist[index];
    statusText.textContent = `Tocando: ${track.file.name}...`;
    
    try {
      const newSource = audioCtx.createBufferSource();
      const newGain = audioCtx.createGain();
      newSource.buffer = track.buffer;

      newSource.connect(newGain);
      newGain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (fadeDuration > 0 && currentGain) {
        currentGain.gain.setValueAtTime(currentGain.gain.value, now);
        currentGain.gain.linearRampToValueAtTime(0.001, now + fadeDuration);
        
        const oldSource = currentSource;
        setTimeout(() => {
          try { oldSource.stop(); } catch(e){}
        }, fadeDuration * 1000);

        newGain.gain.setValueAtTime(0.001, now);
        newGain.gain.linearRampToValueAtTime(1, now + fadeDuration);
      } else {
        newGain.gain.setValueAtTime(1, now);
      }

      newSource.start(now, offset);

      currentSource = newSource;
      currentGain = newGain;
      currentIndex = index;
      isPlaying = true;
      isPaused = false;
      
      startTime = now - offset;
      pauseOffset = 0;

      btnPlayPause.innerHTML = '&#10074;&#10074;';
      btnPlayPause.disabled = false;
      btnPrev.disabled = currentIndex === 0;
      btnNext.disabled = currentIndex === playlist.length - 1;

      currentTrackDisplay.textContent = track.file.name;
      statusText.textContent = "Reproduzindo";

      renderPlaylist();
      trackProgress();

    } catch (err) {
      statusText.textContent = "Erro ao reproduzir faixa.";
    }
  }

  function trackProgress() {
    if (!isPlaying || isPaused) return;

    const elapsed = audioCtx.currentTime - startTime;
    const duration = playlist[currentIndex].duration;
    const fadeTime = parseFloat(fadeSlider.value);

    drawGlobalTimeline(elapsed);

    if (duration > fadeTime && (duration - elapsed) <= fadeTime && currentIndex + 1 < playlist.length) {
      const nextIdx = currentIndex + 1;
      playTrack(nextIdx, fadeTime, 0);
      return;
    }

    animationFrameId = requestAnimationFrame(trackProgress);
  }

  function pauseAudio() {
    if (!isPlaying || isPaused) return;
    
    pauseOffset = audioCtx.currentTime - startTime;
    if (currentSource) {
      try { currentSource.stop(); } catch(e){}
    }
    
    isPaused = true;
    isPlaying = false;
    btnPlayPause.innerHTML = '&#9654;';
    statusText.textContent = "Pausado";
    cancelAnimationFrame(animationFrameId);
  }

  btnPlayPause.addEventListener('click', () => {
    if (isPlaying) {
      pauseAudio();
    } else if (isPaused) {
      playTrack(currentIndex, 0, pauseOffset);
    } else if (playlist.length > 0) {
      playTrack(0, 0, 0);
    }
  });

  btnNext.addEventListener('click', () => {
    if (currentIndex + 1 < playlist.length) {
      const fadeTime = parseFloat(fadeSlider.value);
      playTrack(currentIndex + 1, fadeTime, 0);
    }
  });

  btnPrev.addEventListener('click', () => {
    if (currentIndex - 1 >= 0) {
      playTrack(currentIndex - 1, 0, 0);
    }
  });

  function renderPlaylist() {
    playlistUI.innerHTML = '';

    const total = playlist.length;
    fileCountDisplay.textContent = `${total} ${total === 1 ? 'faixa' : 'faixas'}`;
    btnExport.disabled = total === 0;
    btnCopyTxt.disabled = total === 0;

    if (total === 0) {
      statusText.textContent = "Nenhum arquivo na fila.";
      currentTrackDisplay.textContent = "-";
      btnPlayPause.disabled = true;
      btnPrev.disabled = true;
      btnNext.disabled = true;
      drawGlobalTimeline(0);
      return;
    }

    playlist.forEach((track, idx) => {
      const li = document.createElement('li');
      li.className = 'track-item';
      if (idx === currentIndex && (isPlaying || isPaused)) {
        li.classList.add('active');
      }
      li.draggable = true;
      li.dataset.index = idx;

      li.innerHTML = `
        <span class="track-name">${idx + 1}. ${track.file.name}</span>
        <span class="track-duration">${formatTimeHHMMSS(track.duration)}</span>
        <button class="btn-remove" title="Remover faixa">&times;</button>
      `;

      li.querySelector('.btn-remove').addEventListener('click', (e) => {
        e.stopPropagation();
        removeTrack(idx);
      });

      li.addEventListener('dragstart', handleDragStart);
      li.addEventListener('dragover', handleDragOver);
      li.addEventListener('drop', handleDrop);
      li.addEventListener('dragend', handleDragEnd);

      playlistUI.appendChild(li);
    });

    if (!isPlaying && !isPaused) {
      statusText.textContent = `${playlist.length} faixa(s) na fila.`;
    }
  }

  function removeTrack(idx) {
    playlist.splice(idx, 1);

    if (playlist.length === 0) {
      if (currentSource) try { currentSource.stop(); } catch(e){}
      isPlaying = false;
      isPaused = false;
      btnPlayPause.innerHTML = '&#9654;';
      renderPlaylist();
      drawGlobalTimeline(0);
      return;
    }

    if (idx === currentIndex) {
      if (currentSource) try { currentSource.stop(); } catch(e){}
      isPlaying = false;
      isPaused = false;
      btnPlayPause.innerHTML = '&#9654;';
      
      if (currentIndex >= playlist.length) {
        currentIndex = playlist.length - 1;
      }
      statusText.textContent = "Faixa removida.";
    } else if (idx < currentIndex) {
      currentIndex--;
    }

    btnPrev.disabled = currentIndex === 0;
    btnNext.disabled = currentIndex >= playlist.length - 1;

    renderPlaylist();
    drawGlobalTimeline(0);
  }

  let dragSrcIndex = null;

  function handleDragStart(e) {
    dragSrcIndex = Number(this.dataset.index);
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }

  function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  }

  function handleDrop(e) {
    e.preventDefault();
    const targetIndex = Number(this.dataset.index);

    if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
      const movedItem = playlist.splice(dragSrcIndex, 1)[0];
      playlist.splice(targetIndex, 0, movedItem);

      if (currentIndex === dragSrcIndex) {
        currentIndex = targetIndex;
      } else if (dragSrcIndex < currentIndex && targetIndex >= currentIndex) {
        currentIndex--;
      } else if (dragSrcIndex > currentIndex && targetIndex <= currentIndex) {
        currentIndex++;
      }

      renderPlaylist();
      drawGlobalTimeline(0);
    }
  }

  function handleDragEnd() {
    this.classList.remove('dragging');
  }

  btnCopyTxt.addEventListener('click', () => {
    if (playlist.length === 0) return;

    let txtContent = "RELAÇÃO DA PLAYLIST\n\n";
    playlist.forEach((track, idx) => {
      txtContent += `${idx + 1}. ${track.file.name} (${formatTimeHHMMSS(track.duration)})\n`;
    });

    const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'relacao_playlist.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  btnExport.addEventListener('click', async () => {
    if (playlist.length === 0) return;

    btnExport.disabled = true;
    exportPanel.style.display = 'block';
    exportStatusText.textContent = "Carregando motor FFmpeg...";
    exportProgressFill.style.width = '0%';
    exportPercent.textContent = '0%';

    try {
      if (!ffmpeg) {
        ffmpeg = createFFmpeg({ log: false });
      }
      if (!ffmpeg.isLoaded()) {
        await ffmpeg.load();
      }

      const totalTracks = playlist.length;
      let concatListContent = "";

      for (let i = 0; i < totalTracks; i++) {
        const item = playlist[i];
        const fileName = `input_${i}.mp3`;

        exportStatusText.textContent = `Agregando áudio ${i + 1} de ${totalTracks}...`;
        exportTrackCurrent.textContent = item.file.name;

        ffmpeg.FS('writeFile', fileName, await fetchFile(item.file));
        concatListContent += `file '${fileName}'\n`;

        const pct = Math.round(((i + 1) / totalTracks) * 70);
        exportProgressFill.style.width = `${pct}%`;
        exportPercent.textContent = `${pct}%`;
      }

      ffmpeg.FS('writeFile', 'filelist.txt', concatListContent);

      exportStatusText.textContent = "Unificando faixas com qualidade original...";
      exportTrackCurrent.textContent = "Processando arquivo final...";
      exportProgressFill.style.width = '85%';
      exportPercent.textContent = '85%';

      await ffmpeg.run('-f', 'concat', '-safe', '0', '-i', 'filelist.txt', '-c', 'copy', 'output.mp3');

      const data = ffmpeg.FS('readFile', 'output.mp3');

      exportProgressFill.style.width = '100%';
      exportPercent.textContent = '100%';
      exportStatusText.textContent = "Concluído! O download começará em instantes.";

      const blob = new Blob([data.buffer], { type: 'audio/mp3' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Concert_MP3_Playlist_Unificada.mp3';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      for (let i = 0; i < totalTracks; i++) {
        try { ffmpeg.FS('unlink', `input_${i}.mp3`); } catch(e){}
      }
      try { ffmpeg.FS('unlink', 'filelist.txt'); } catch(e){}
      try { ffmpeg.FS('unlink', 'output.mp3'); } catch(e){}

    } catch (err) {
      console.error(err);
      exportStatusText.textContent = "Erro durante a geração do arquivo unificado.";
    } finally {
      setTimeout(() => {
        exportPanel.style.display = 'none';
        btnExport.disabled = playlist.length === 0;
      }, 4000);
    }
  });

  window.addEventListener('load', () => drawGlobalTimeline(0));
  window.addEventListener('resize', () => drawGlobalTimeline(0));
</script>

</body>
</html>
